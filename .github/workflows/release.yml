name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Extract release notes from CHANGELOG
        # Notes are authored, not generated: CHANGELOG.md is the curated record,
        # so the release body IS this tag's CHANGELOG section, lifted verbatim —
        # and the step hard-fails rather than warns when the section is missing.
        # First step after checkout: it needs nothing from the build, so a
        # missing section fails in seconds, not after minutes of compiling.
        #
        # Terminates the section on the next '## [' heading OR the first
        # link-reference definition ('[x]: url' at line start - the block at
        # the bottom of the file, which is what follows the oldest entry;
        # a bare line-start '[' is NOT a terminator, so a body line wrapping
        # onto a markdown link cannot silently truncate the notes), then trims
        # blank lines off both ends.
        #
        # A prerelease tag (any SemVer suffix, e.g. v0.2.0-rc.1) carries no
        # CHANGELOG section by design: candidates are private test builds that
        # never reach the Workshop, and their changes land in the stable
        # version's section at promotion. They get a fixed stub instead, with
        # the auto-generated commit list appended by the release step.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            echo "Release candidate for testing only. Not published to Steam Workshop." > RELEASE_NOTES.md
            exit 0
          fi
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { p = 1; next }
            p && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]:/) { exit }
            p { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' \
            > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No '## [$version]' section with content found in CHANGELOG.md - add one before tagging v$version."
            exit 1
          fi
          echo "Release notes for $version:"
          cat RELEASE_NOTES.md

      # Validates against the checked-in Scripts/expected-injections.json sidecar
      # (generated locally by the L10nProbe dev mod via the game's own DefInjected
      # walker, since CI cannot boot the game) and fails fast before the build.
      - name: Check translations
        run: python3 Scripts/check-translations.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # VFEPirates.dll and VEF.dll are referenced compile-only by the csproj (Private="false");
      # the Workshop copy is what players actually run against, so it is the compile contract -
      # not a locally rebuilt branch DLL. Decided 2026-09-16 to fetch both here with SteamCMD
      # rather than commit copies under source control, since committing would pin a version and
      # let it drift from what's live on the Workshop.
      - name: Compute cache key date
        id: cache-date
        run: echo "yyyymm=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Best-effort speedup only, not required for correctness: if the cache misses (wrong month,
      # first run, or steamcmd's actual download path doesn't match one of the guesses below), the
      # download step below just fetches from scratch. Keyed on both Workshop ids plus year-month
      # so the cache self-refreshes monthly instead of pinning forever - github.run_id would never
      # hit since it's unique per run. restore-keys falls back to the newest same-id cache.
      - name: Cache Workshop downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Steam/steamapps/workshop/content/294100
            ~/.steam/steam/steamapps/workshop/content/294100
            ~/.local/share/Steam/steamapps/workshop/content/294100
          key: workshop-2023507013-2723801948-${{ steps.cache-date.outputs.yyyymm }}
          restore-keys: |
            workshop-2023507013-2723801948-

      - name: Setup SteamCMD
        uses: CyberAndrii/setup-steamcmd@v1

      # Anonymous SteamCMD login can download public Workshop items without credentials.
      # Downloads flake occasionally, so retry a few times per item. SteamCMD's download
      # location varies by install/version, so locate the "294100/<id>" content directory with
      # find instead of assuming a path, and verify the expected DLL actually landed before
      # trusting the download.
      - name: Fetch VEF and VFE Pirates from the Workshop
        run: |
          set -euo pipefail

          download_item() {
            local id="$1"
            local dll_rel="$2"
            local attempt=1
            while [ "$attempt" -le 3 ]; do
              echo "Downloading Workshop item $id (attempt $attempt/3)..." >&2
              steamcmd +login anonymous +workshop_download_item 294100 "$id" +quit >&2 || true

              local content_dir
              content_dir="$(find "$HOME" -type d -path "*/294100/$id" 2>/dev/null | head -n1)"
              if [ -n "$content_dir" ] && [ -f "$content_dir/$dll_rel" ]; then
                echo "Found item $id at $content_dir" >&2
                printf '%s' "$content_dir"
                return 0
              fi

              attempt=$((attempt + 1))
              sleep 10
            done
            return 1
          }

          vef_dir="$(download_item 2023507013 "1.6/Assemblies/VEF.dll")" || {
            echo "::error::Failed to download Vanilla Expanded Framework (Workshop item 2023507013) after 3 attempts, or VEF.dll is missing from the downloaded content."
            exit 1
          }
          vfep_dir="$(download_item 2723801948 "1.6/Assemblies/VFEPirates.dll")" || {
            echo "::error::Failed to download Vanilla Factions Expanded - Pirates (Workshop item 2723801948) after 3 attempts, or VFEPirates.dll is missing from the downloaded content."
            exit 1
          }

          echo "VEF_PATH=$vef_dir" >> "$GITHUB_ENV"
          echo "VFEP_PATH=$vfep_dir" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build MedicWarcasket.sln -c Release

      - name: Stage mod files
        # Reuse the .csproj's StageMod target — the single source of truth for what
        # files constitute the mod — so the release zip can never drift from the
        # local deploy (e.g. forget Patches). StageMod wipes + recopies $(StageDir).
        # The folder name is the project name, matching the local deploy folder
        # ($(MSBuildProjectName)) and the README's install instructions.
        run: >
          dotnet build Source/1.6/MedicWarcasket.csproj -c Release
          -t:StageMod -p:StageDir=${{ github.workspace }}/release/MedicWarcasket

      - name: Package mod
        run: |
          set -e
          cd release && zip -r ../MedicWarcasket-${GITHUB_REF_NAME}.zip MedicWarcasket

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: MedicWarcasket-${{ github.ref_name }}.zip
          # body_path is pre-pended to the auto-generated notes by the GitHub API,
          # so the curated CHANGELOG prose leads and the compare link (plus any
          # contributor PRs) follows it - not the other way round. GitHub picks
          # the compare link's base itself (no previous_tag_name here), and it
          # counts prereleases, so the first stable after a candidate line gets
          # an rc.N...stable link; the CHANGELOG section above it still spans
          # everything since the last stable, which is the record that matters.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # Same test as the notes step: any SemVer suffix marks a prerelease,
          # which also keeps it from becoming the repo's "Latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}
